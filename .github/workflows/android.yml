name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm test && pnpm desktop:test && pnpm lint && pnpm android:build
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: android/app/build/reports/androidTests/
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.DAILY_ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/daily.p12"
          chmod 600 "$RUNNER_TEMP/daily.p12"
      - name: Build signed APK and run Android lint
        working-directory: android
        env:
          DAILY_KEYSTORE_PATH: ${{ runner.temp }}/daily.p12
          DAILY_KEYSTORE_PASSWORD: ${{ secrets.DAILY_ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease :app:testDebugUnitTest --no-daemon
      - name: Verify signature and prepare download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/Daily-0.3.0-android.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Daily-0.3.0-android.apk
          cd artifacts
          sha256sum Daily-0.3.0-android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-Android
          path: artifacts/
          retention-days: 30
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/daily.p12"
